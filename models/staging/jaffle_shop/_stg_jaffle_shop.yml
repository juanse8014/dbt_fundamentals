models:
  - name: stg_jaffle_shop__customers
    description: The grain of this table is one unique customer per row
    config:
      #access: protected #Any model in this project can reference this model, but outside this project cannot
      access: private
      group: product
    columns:
      - name: customer_id
        description: Primary Key for the customers table
        data_tests:
          - unique
          - not_null
          
  - name: stg_jaffle_shop__orders
    description: One order per row

    config:
      contract:
        enforced: true #Model Contract to ensure the shape of the model

    columns:
      - name: order_id
        description: Primary key for orders table
        data_type: number

      - name: customer_id
        data_type: number
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        data_type: date

      - name: order_status
        description: "{{ doc('order_status') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - placed
                  - return_pending
                  - returned

      - name: last_update
        data_type: timestamp_ntz